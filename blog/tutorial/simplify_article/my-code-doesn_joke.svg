<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Card Shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Code Glow -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Button Gradient -->
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Title / Meme Quote Header -->
  <text x="400" y="70" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="800" letter-spacing="0.5">
    "My code doesn't work..."
  </text>

  <!-- Terminal Window Container -->
  <g filter="url(#drop-shadow)">
    <!-- Terminal Outer Frame -->
    <rect x="100" y="110" width="600" height="360" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Terminal Header Bar -->
    <path d="M 100 122 A 12 12 0 0 1 112 110 L 688 110 A 12 12 0 0 1 700 122 L 700 150 L 100 150 Z" fill="#0f172a" />
    
    <!-- Window Control Buttons -->
    <circle cx="125" cy="130" r="6" fill="#ef4444" />
    <circle cx="145" cy="130" r="6" fill="#f59e0b" />
    <circle cx="165" cy="130" r="6" fill="#10b981" />
    
    <!-- Window Title -->
    <text x="400" y="134" text-anchor="middle" fill="#64748b" font-size="13" font-family="monospace">developer_logic.js</text>

    <!-- Code Editor Content -->
    <g font-family="Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace" font-size="15">
      <!-- Line Numbers -->
      <g fill="#475569" text-anchor="end">
        <text x="135" y="190">1</text>
        <text x="135" y="220">2</text>
        <text x="135" y="250">3</text>
        <text x="135" y="280">4</text>
        <text x="135" y="310">5</text>
      </g>

      <!-- Code Text -->
      <g>
        <!-- Line 1 -->
        <text x="160" y="190">
          <tspan fill="#f43f5e">const</tspan> <tspan fill="#e2e8f0">status</tspan> = <tspan fill="#38bdf8">'broken'</tspan>;
        </text>
        
        <!-- Line 2 (Error highlight line) -->
        <rect x="150" y="202" width="530" height="26" fill="#ef4444" fill-opacity="0.15" rx="4"/>
        <text x="160" y="220">
          <tspan fill="#f43f5e">throw</tspan> <tspan fill="#f43f5e">new</tspan> <tspan fill="#facc15">Error</tspan>(<tspan fill="#38bdf8">"Unknown error on line 42"</tspan>);
        </text>
        
        <!-- Line 3 -->
        <text x="160" y="250">
          <tspan fill="#64748b">// Solution:</tspan>
        </text>

        <!-- Line 4 -->
        <text x="160" y="280">
          <tspan fill="#f43f5e">function</tspan> <tspan fill="#60a5fa">fixBug</tspan>() {
        </text>

        <!-- Line 5 -->
        <text x="160" y="310">
          <tspan fill="#64748b" font-style="italic">  // do absolutely nothing</tspan>
        </text>
        <text x="160" y="340">
          <tspan fill="#e2e8f0">}</tspan>
        </text>
      </g>

      <!-- Console / Error Output Box -->
      <rect x="150" y="365" width="500" height="80" rx="6" fill="#020617" stroke="#dc2626" stroke-width="1"/>
      <text x="170" y="392" fill="#ef4444" font-size="13" filter="url(#glow-red)">
        ✖ Uncaught Error: Code failed successfully.
      </text>
      <text x="170" y="415" fill="#94a3b8" font-size="12">
        &gt; Retrying without changes...
      </text>
      <!-- Blinking Cursor -->
      <rect x="355" y="404" width="8" height="14" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Big Action Button (The Joke Punchline) -->
  <g id="run-button" filter="url(#drop-shadow)">
    <!-- Button Background -->
    <rect x="200" y="500" width="400" height="54" rx="27" fill="url(#btn-grad)" />
        
    <!-- Button Text -->
    <text x="405" y="534" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="0.5">
      Let's change nothing &amp; run it again
    </text>
  </g>
</svg>
